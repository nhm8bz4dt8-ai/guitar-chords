<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ギターコード フォーム図鑑</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#f5f7fa;color:#172337;max-width:950px;margin:24px auto;padding:0 16px}h1{font-size:25px;margin-bottom:5px}.sub{color:#65748a}input{font-size:20px;padding:12px;border:1px solid #bbc6d2;border-radius:10px;width:180px}button{background:#1667a4;color:white;border:0;border-radius:9px;padding:12px 16px;cursor:pointer}button.secondary{background:#e4edf5;color:#194f79}.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:13px}.card{background:white;border:1px solid #d9e1eb;border-radius:14px;padding:15px}.card h2{font-size:18px;margin:0 0 5px}.meta{color:#637286;font-size:13px}.diagram{width:100%;height:auto}.tab{display:inline-block;border-radius:8px;background:#eef3f8;padding:4px 8px;font-size:12px;margin-bottom:8px}#err{color:#a12c2c}footer{color:#65748a;font-size:13px;margin:20px 0}</style><h1>🎸 ギターコード フォーム図鑑</h1><p class="sub">コード名から、基本形・コンパクトな押さえ方・転回形を表示。コードチェンジの最適化は行わない。</p><form id="form"><input id="chord" value="C" aria-label="コード名" placeholder="例：Am7"><button>押さえ方を表示</button></form><div class="chips" id="examples"></div><p id="info"></p><p id="err"></p><div class="cards" id="cards"></div><footer>標準チューニング E–A–D–G–B–E。左から6弦→1弦。●は押さえる位置、○は開放弦、×は弾かない弦。3点押弦は3か所を押さえるという意味（3本の弦だけ鳴らすという意味ではない）。転回形は最低音がルート以外のフォーム。</footer><script>
const pcs=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'],strings=[4,9,2,7,11,4];
const types={'':[0,4,7],m:[0,3,7],7:[0,4,7,10],maj7:[0,4,7,11],m7:[0,3,7,10]};
const presets={
C:['x32010','xx2010','x35553','8AA988','xxx553'],G:['320003','320033','3x0003','355433','xx5433'],D:['xx0232','xx0230','x57775','xx7775'],A:['x02220','xx2220','577655','xx7655'],E:['022100','xx2100','x79997','xx9997'],F:['133211','xx3211','xx3210','x87565','xx7565'],B:['x24442','xx4442','799877','xx9877'],
Am:['x02210','xx2210','577555','xx7555'],Em:['022000','xx2000','x79987','xx9987'],Dm:['xx0231','x57765','xx7765'],Cm:['x35543','xx5543','8AA888'],Gm:['355333','xx5333','xx8786'],Bm:['x24432','xx4432','799777'],
Am7:['x02010','xx2010','575555','xx5555'],Em7:['020000','xx0000','x79787','xx9787'],Dm7:['xx0211','x57565','xx7768'],Cmaj7:['x32000','xx2000','x35453'],Fmaj7:['xx3210','x87555','xx7565'],Gmaj7:['320002','xx5432','3x4432'],G7:['320001','xx0001','353433','xx5431'],D7:['xx0212','x57575','xx7778'],A7:['x02020','xx2020','575655'],E7:['020100','xx0100','x79797'],C7:['x32310','x35353','xx8988']};
function parse(s){const m=s.trim().match(/^([A-Ga-g])([#b♯♭]?)(maj7|m7|m|7)?$/);if(!m)return null;const root=(pcs.indexOf(m[1].toUpperCase())+({'#':1,'♯':1,b:-1,'♭':-1}[m[2]]||0)+12)%12;return {root,suffix:m[3]||'',name:s.trim(),tones:types[m[3]||''].map(x=>(x+root)%12)}}
function decode(st){return [...st].map(c=>c==='x'?null:parseInt(c,16))}
function valid(a,ch){const sounding=a.map((f,i)=>f===null?null:(strings[i]+f)%12).filter(x=>x!==null);return sounding.length>=3&&ch.tones.every(x=>sounding.includes(x))&&sounding.every(x=>ch.tones.includes(x))}
function candidates(ch){let arr=[],seen=new Set();function add(a){if(a.some(x=>x!==null&&(x<0||x>16))||!valid(a,ch))return;const key=a.join(',');if(seen.has(key))return;seen.add(key);const pressed=a.filter(x=>x>0),open=a.filter(x=>x===0).length,first=a.findIndex(x=>x!==null),bass=(strings[first]+a[first])%12;const span=pressed.length?Math.max(...pressed)-Math.min(...pressed):0;arr.push({a,pressed:pressed.length,open,inversion:bass!==ch.root,bass:pcs[bass],span,low:pressed.length?Math.min(...pressed):0})}
if(presets[ch.name])presets[ch.name].forEach(s=>add(decode(s)));
// Transpose movable voicings only. Open-string voicings are not transposed.
for(const [name,shapes] of Object.entries(presets)){const src=parse(name);if(!src||src.suffix!==ch.suffix)continue;let shift=(ch.root-src.root+12)%12;for(const st of shapes){const a=decode(st);if(a.some(f=>f===0))continue;for(const d of [shift,shift-12]){const b=a.map(f=>f===null?null:f+d);if(b.some(f=>f!==null&&f<1))continue;add(b)}}}
// Prefer common open and low-position voicings; cap the catalog.
arr.sort((a,b)=>(a.inversion?2:0)-(b.inversion?2:0)+a.span*.5-b.span*.5+a.low*.12-b.low*.12-a.open*.6+b.open*.6);
return arr.slice(0,12)}
function diagram(a){let pos=a.filter(x=>x>0),base=a.includes(0)?1:Math.min(...pos);let s='<svg class="diagram" viewBox="0 0 220 230" role="img" aria-label="コード指板図">';for(let i=0;i<6;i++){let x=30+i*32;s+=`<text x="${x}" y="17" text-anchor="middle" font-size="12" fill="#334155">${'EADGBe'[i]}</text><line x1="${x}" y1="42" x2="${x}" y2="202" stroke="#8997aa"/>`}for(let i=0;i<5;i++){let y=42+i*40;s+=`<line x1="30" y1="${y}" x2="190" y2="${y}" stroke="#8997aa" stroke-width="${i===0&&base===1?4:1}"/>`}for(let i=0;i<4;i++)s+=`<text x="12" y="${68+i*40}" font-size="11" fill="#64748b">${base+i}</text>`;a.forEach((f,i)=>{let x=30+i*32;if(f===null)s+=`<text x="${x}" y="35" text-anchor="middle" fill="#bb5252">×</text>`;else if(f===0)s+=`<circle cx="${x}" cy="29" r="6" fill="none" stroke="#15845d" stroke-width="2"/>`;else s+=`<circle cx="${x}" cy="${62+(f-base)*40}" r="12" fill="#1769aa"/>`});return s+'</svg>'}
function show(){let raw=document.getElementById('chord').value.trim(),ch=parse(raw),err=document.getElementById('err'),cards=document.getElementById('cards'),info=document.getElementById('info');err.textContent='';cards.innerHTML='';info.textContent='';if(!ch){err.textContent='対応表記：C、Am、G7、Cmaj7、F#m7、Bb など';return}const forms=candidates(ch);info.textContent=`${ch.name}｜構成音：${ch.tones.map(x=>pcs[x]).join('・')}｜${forms.length}フォーム`;if(!forms.length){err.textContent='このコードの登録済みフォームはまだない。';return}forms.forEach((o,i)=>{let card=document.createElement('article');card.className='card';let label=i===0?'基本・おすすめ':o.inversion?'転回形':o.pressed<=3?'コンパクト':'別ポジション';card.innerHTML=`<span class="tab">${label}</span><h2>${ch.name} · ${i+1}</h2>${diagram(o.a)}<p><b>${o.a.map(x=>x===null?'×':x).join(' – ')}</b></p><p class="meta">${o.pressed}か所押弦 · ${o.open}本開放 · 最低音 ${o.bass}${o.inversion?'（転回形）':''}</p>`;cards.appendChild(card)})}
document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();show()});for(const s of ['C','G','Am','F','Am7','Cmaj7','D7','F#m7']){let b=document.createElement('button');b.className='secondary';b.textContent=s;b.onclick=()=>{document.getElementById('chord').value=s;show()};document.getElementById('examples').appendChild(b)}show();</script></html>
